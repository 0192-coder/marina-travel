<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Contact Marina Travel for tour consultation and booking requests." />
  <meta name="keywords" content="Marina Travel contact, consultation, booking" />
  <meta name="author" content="Your Name" />
  <title>Marina Travel | Contact</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">📍 Marina Travel</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div id="nav" class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto gap-1">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="game.html">Game</a></li>
        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
      </ul>
      <button class="btn btn-sm btn-light ms-lg-3" onclick="toggleAccent()">Accent</button>
    </div>
  </div>
</nav>

<main class="container my-5">
  <h1 class="section-title">Contact & Consultation</h1>
  <p class="mt-3">
    This form is included to support consultation registration. It uses basic validation to prevent empty submissions.
  </p>

  <div id="formAlert" class="alert alert-danger d-none" role="alert"></div>

  <form class="card p-4 mt-3" onsubmit="return validateContactForm(event)">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Full name</label>
        <input id="name" class="form-control" type="text" placeholder="e.g., Nguyen Van A" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input id="email" class="form-control" type="email" placeholder="e.g., example@email.com" />
      </div>
      <div class="col-12">
        <label class="form-label">Message</label>
        <textarea id="message" class="form-control" rows="4" placeholder="Tell us your preferred tour and dates..."></textarea>
      </div>
    </div>
    <button class="btn btn-primary mt-3" type="submit">Submit</button>
  </form>
</main>

<footer class="footer py-4 mt-5">
  <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
    <div>
      <div class="fw-bold">Marina Travel</div>
      <div class="small">Static Website Project (Unit 13)</div>
    </div>
    <div class="small">
      <a href="services.html">Tours</a> · <a href="about.html">About</a> · <a href="index.html">Home</a>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
